name: generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: generate snake svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAKE_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          SNAKE_USER: clouqs
          SNAKE_FROM: "2025-01-01"
          SNAKE_TO: "2026-08-26"
        run: |
          npm install --no-save generate-snake-animation@3.5.0
          node .github/scripts/generate-snake.mjs

      - name: push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
